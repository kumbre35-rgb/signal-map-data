# On every push to main: validate the JSON, rebuild manifest.json pinned to
# this commit, commit it back, and purge the jsDelivr cache so apps see the
# new manifest within seconds instead of hours.
name: publish
on:
  push:
    branches: [main]
    paths-ignore: [manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/validate.mjs
      - run: node scripts/build-manifest.mjs --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: commit manifest
        run: |
          git config user.name  "signal-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "manifest unchanged" && exit 0
          git commit -m "manifest: publish ${GITHUB_SHA::7} [skip ci]"
          git push
      - name: purge jsDelivr cache
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/manifest.json" || true
